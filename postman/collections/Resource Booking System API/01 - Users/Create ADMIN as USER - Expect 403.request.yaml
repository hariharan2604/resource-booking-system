$kind: http-request
url: '{{baseUrl}}/api/users'
method: POST
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userJwt}}'
body:
  type: json
  content: |-
    {
      "username": "shouldfail",
      "password": "password123",
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Access denied for USER role (403)', function () {
          pm.expect(pm.response.code).to.equal(403);
      });
