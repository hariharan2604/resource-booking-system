name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean verify

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    # Only push to Docker Hub when code is pushed to master.
    # PRs will run tests but won't push an image.
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/resource-booking-system:${IMAGE_TAG} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/resource-booking-system:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/resource-booking-system:${IMAGE_TAG}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/resource-booking-system:latest