$kind: http-request
url: '{{baseUrl}}/api/reservations?page=0&size=20'
method: GET
order: 3000
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: page
    value: '0'
    description: Page number (0-based)
  - key: size
    value: '20'
    description: Page size
  - key: sort
    value: createdAt
    description: 'Sort field and direction'
    disabled: true
  - key: status
    value: 'CONFIRMED'
    description: 'Filter by status: PENDING, CONFIRMED, CANCELLED'
    disabled: true
  - key: minPrice
    value: ''
    description: Minimum total price (inclusive)
    disabled: true
  - key: maxPrice
    value: ''
    description: Maximum total price (inclusive)
    disabled: true
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminJwt}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('All reservations listed successfully', function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      const body = pm.response.json();

      pm.test('Response is paginated', function () {
          pm.expect(body).to.have.property('content');
          pm.expect(body).to.have.property('totalElements');
          pm.expect(body.content).to.be.an('array');
      });

      console.log('Total reservations:', body.totalElements);
