$kind: http-request
url: '{{baseUrl}}/api/resources?page=0&size=20'
method: GET
order: 2000
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: page
    value: '0'
    description: Page number (0-based)
  - key: size
    value: '20'
    description: Page size
  - key: sort
    value: id
    description: 'Sort field and direction (e.g. id or pricePerHour,desc)'
    disabled: true
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userJwt}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Resources listed successfully', function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      const body = pm.response.json();

      pm.test('Response is paginated', function () {
          pm.expect(body).to.have.property('content');
          pm.expect(body).to.have.property('totalElements');
          pm.expect(body.content).to.be.an('array');
      });
