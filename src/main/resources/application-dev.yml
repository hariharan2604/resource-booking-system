spring:
  datasource:
    url: jdbc:h2:mem:booking_db;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: simple
    cache-names:
      - resources
      - reservations

logging:
  level:
    org.springframework.security: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:VGV2ZWxvcG1lbnRPbmx5SFAyU2VjcmV0S2V5Rm9yTG9jYWxSdW5zMTIzNDU2Nzg5MA==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}