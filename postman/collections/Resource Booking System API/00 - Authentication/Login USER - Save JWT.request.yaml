$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
order: 2000
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "{{userUsername}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('User login successful', function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      const body = pm.response.json();

      pm.test('JWT token returned', function () {
          pm.expect(body).to.have.property('token');
          pm.expect(body.token).to.be.a('string').and.not.empty;
      });

      if (body.token) {
          const token = body.token;
          pm.environment.set('userJwt', token);
          console.log('userJwt saved, length:', token.length);
      }
    language: text/javascript
